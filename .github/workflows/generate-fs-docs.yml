name: SignalWire Docs

on:

  push:
    branches:
    - main

  pull_request:
    branches:
    - main

  workflow_dispatch:

jobs:
  build:
    name: "Build image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: freeswitch-docs:ci
      - name: Check generated redirect map
        run: node scripts/build-legacy-redirects.mjs --check
      - name: Validate nginx config
        run: docker run --rm freeswitch-docs:ci nginx -t
      - name: Check redirects end to end
        run: |
          docker run -d --name fs-docs -p 8080:80 freeswitch-docs:ci
          sleep 3
          node scripts/check-redirects.mjs http://localhost:8080
